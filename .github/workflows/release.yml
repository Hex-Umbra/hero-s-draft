name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version a publier, SANS le prefixe v (ex: 0.4.7). Vide = deduite du tag cible."
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Un tag peut etre pousse sur n'importe quel commit, y compris un commit qui
  # n'a jamais transite par un push/PR vers main. ci.yml ne se declenche donc
  # jamais sur ce chemin : cette porte de qualite est propre a release.yml et
  # tourne en parallele de verify-version (pas de needs).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart analyze --fatal-infos

      - run: flutter test

      - run: bash .github/scripts/test_scripts.sh

  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # Deux sources possibles : l'entree manuelle, ou le tag qui a declenche le
      # run. Dans les deux cas la valeur passe ensuite par le meme garde-fou.
      - id: resolve
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          VERSION="${VERSION_INPUT}"

          if [[ -z "${VERSION}" ]]; then
            if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
              echo "::error::Aucune version fournie et ${GITHUB_REF} n'est pas un tag. Fournis l'entree 'version', ou cible un tag vX.Y.Z."
              exit 1
            fi
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi

          bash .github/scripts/verify_version.sh "${VERSION}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build-web:
    needs: [verify-version, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      # --base-href est OBLIGATOIRE : web/index.html contient
      # <base href="$FLUTTER_BASE_HREF">, qui vaut "/" par defaut. Servi depuis
      # /v0.4.7/ sans ce flag, l'app chercherait main.dart.js et CanvasKit a la
      # racine du domaine -> page blanche.
      - run: flutter build web --release --base-href "/v${{ needs.verify-version.outputs.version }}/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  build-windows:
    needs: [verify-version, quality]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: Zip du build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "heros-draft-v${{ needs.verify-version.outputs.version }}-windows.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: heros-draft-*-windows.zip
          retention-days: 7

  deploy-web:
    needs: [verify-version, build-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-build
          path: web-build

      - uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      # La cle d'hote est capturee une fois a la main et stockee en secret.
      # Un `ssh-keyscan` execute ici accepterait n'importe quelle cle presentee,
      # ce qui rendrait tout MITM indetectable.
      - name: Cle d'hote connue
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # La cible est RELATIVE. La commande forcee `rrsync -wo /var/www/prototypes`
      # cote serveur resout les chemins depuis la racine confinee : un chemin
      # absolu echouerait.
      #
      # Pas de symlink "latest" a basculer : ecrire dans un dossier de version
      # neuf ne touche a aucune version deja en ligne ni a la page de selection
      # servie a la racine. L'atomicite est acquise sans mecanisme.
      - name: rsync vers le VPS
        run: |
          set -euo pipefail
          rsync -avz --delete \
            web-build/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:v${{ needs.verify-version.outputs.version }}/"

  # Un rsync vert prouve que des fichiers sont sur le disque, pas que le jeu se
  # lance. Ce job fait la difference, et c'est lui qui autorise la suite : ni le
  # site ni Discord n'annoncent une version qui n'a pas passe cette porte.
  smoke-test:
    needs: [verify-version, deploy-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: La version deployee repond et porte le bon base href
        run: |
          set -euo pipefail
          bash .github/scripts/smoke_test.sh \
            "https://heros-draft.vilarserver.com" \
            "${{ needs.verify-version.outputs.version }}"

  release-windows:
    needs: [verify-version, build-windows]
    runs-on: ubuntu-latest
    # Seul job du pipeline autorise a ecrire dans le repo, et uniquement pour
    # publier une release. Aucun autre ne peut y toucher.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build
          path: .

      # Le `cat` est volontaire : il rend le markdown visible dans les logs,
      # donc diagnosticable sans republier la release.
      - name: Corps de release depuis les patch notes
        run: |
          set -euo pipefail
          bash .github/scripts/release_body.sh > RELEASE_BODY.md
          cat RELEASE_BODY.md

      # action-gh-release est idempotent : il met a jour une release existante
      # au lieu d'echouer, donc un re-run apres incident ne demande aucun
      # nettoyage manuel.
      - uses: softprops/action-gh-release@fe965f7af51af5f2602596916f38a38df2e33de0 # v3.0.2
        with:
          tag_name: v${{ needs.verify-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_BODY.md
          prerelease: true
          files: heros-draft-*-windows.zip

  # Un webhook muet ne doit jamais peindre en rouge une release par ailleurs
  # parfaite : continue-on-error laisse le job en avertissement sans invalider
  # le run. `if: success()` limite l'annonce aux releases reussies -- GitHub
  # envoie deja un e-mail en cas d'echec.
  notify-discord:
    needs: [verify-version, smoke-test, release-windows]
    if: success()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # Le payload est construit puis envoye en deux etapes distinctes : le
      # `cat` rend le JSON lisible dans les logs, donc diagnosticable sans
      # renvoyer de message. Le webhook, lui, n'apparait jamais dans les logs.
      - name: Construire le payload
        run: |
          set -euo pipefail
          bash .github/scripts/discord_payload.sh \
            "${{ needs.verify-version.outputs.version }}" > discord.json
          cat discord.json

      - name: Envoyer sur Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "::error::Le secret DISCORD_WEBHOOK_URL est absent ou vide."
            exit 1
          fi
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            --data @discord.json \
            "${DISCORD_WEBHOOK_URL}")"
          if [[ "${CODE}" != "204" ]]; then
            echo "::error::Discord a repondu ${CODE}, attendu 204."
            exit 1
          fi
          echo "Annonce publiee."
