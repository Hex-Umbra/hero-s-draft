name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Deux pushes rapproches ne doivent pas produire deux runs concurrents aux
# resultats entrelaces. Volontairement absent de release.yml : on n'annule
# jamais un deploiement en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - run: flutter pub get

      # --fatal-infos est necessaire : sans lui, `dart analyze` sort en 0 sur les
      # diagnostics de niveau `info`, et la CI n'appliquerait pas la regle
      # "zero issue" de CLAUDE.md.
      - run: dart analyze --fatal-infos

      - run: flutter test

      # Node est preinstalle sur ubuntu-latest : aucune action tierce
      # supplementaire a epingler. La version est affichee pour que la moindre
      # derive de l'image runner soit visible dans les logs.
      - run: node --version

      # Lance depuis site/ sans argument de chemin : c'est la decouverte par
      # defaut de Node, qui trouve tout *.test.js de l'arborescence. Passer le
      # repertoire en argument (`node --test site/_site/js/`) echoue -- Node
      # tente alors de charger le repertoire comme module d'entree.
      #
      # `node --test` sort 0 meme s'il ne decouvre AUCUN fichier de test -- un
      # renommage de repertoire ou un changement de version de Node modifiant
      # les motifs de decouverte par defaut ferait passer cette porte au vert
      # sans avoir rien teste. Le nombre de tests rapporte est donc verifie
      # explicitement, en plus du code de sortie : c'est la seule porte du
      # chantier qui echouait ouverte plutot que fermee.
      - name: Tests de la logique du site
        working-directory: site
        run: |
          set -euo pipefail
          OUT="$(mktemp)"
          trap 'rm -f "${OUT}"' EXIT
          node --test 2>&1 | tee "${OUT}"
          COUNT="$(grep -oE 'tests [0-9]+$' "${OUT}" | grep -oE '[0-9]+' | tail -1)"
          if [[ -z "${COUNT}" || "${COUNT}" -eq 0 ]]; then
            echo "::error::node --test n'a rapporte aucun test execute (0 test detecte). La decouverte automatique ne trouve plus aucun fichier *.test.js : ce gate echouerait silencieusement sans cette verification."
            exit 1
          fi
          echo "node --test a bien execute ${COUNT} test(s)."

      # Les scripts de release sont utilises par release.yml ; les tester ici
      # evite qu'ils pourrissent sans que personne s'en apercoive.
      - run: bash .github/scripts/test_scripts.sh
