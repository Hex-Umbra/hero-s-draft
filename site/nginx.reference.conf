# MIROIR EN LECTURE SEULE -- NE PAS DEPLOYER, NE PAS EDITER POUR PRODUIRE UN EFFET.
#
# La verite est le fichier installe sur le VPS. Cette copie est versionnee
# parce que le site depend du comportement exact de deux blocs :
#
#   location /                    sert index.html, versions.html, notes.html et
#                                 tout /_site/ depuis la racine.
#   location ~ ^/(v[0-9][^/]*)    sert chaque dossier de version en SPA. Un
#                                 dossier ABSENT y produit un HTTP 500, pas un
#                                 404 : try_files boucle sur une cible de repli
#                                 qui n'existe pas non plus. C'est pourquoi
#                                 versions.json ne doit lister que des dossiers
#                                 reellement en ligne.
#
# Le job de deploiement exclut ce fichier du rsync.

server {
    server_name heros-draft.vilarserver.com;

    root /var/www/prototypes;
    index index.html;

    # BLOC 1 : Racine du site (pour l'index.html de sélection)
    location / {
        try_files $uri $uri/ =404;
    }

    # BLOC 2 : Gestion dynamique des versions (v1, v5, v0.0.2, v0.0.3, etc.)
    # Cette règle capture n'importe quel dossier commençant par 'v' suivi d'un chiffre
    location ~ ^/(v[0-9][^/]*) {
        try_files $uri $uri/ /$1/index.html;
    }

    # BLOC 3 : Gestion spécifique pour heros-draft (Legacy v0.0.1)
    location /heros-draft/ {
        try_files $uri $uri/ /heros-draft/index.html;
    }

    # Sécurité : Interdire l'accès aux fichiers cachés
    location ~ /\. {
        deny all;
    }

    # --- CONFIGURATION SSL (Certbot) ---
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/heros-draft.vilarserver.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/heros-draft.vilarserver.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# --- REDIRECTION HTTP vers HTTPS ---
server {
    if ($host = heros-draft.vilarserver.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name heros-draft.vilarserver.com;
    return 404; # managed by Certbot
}
