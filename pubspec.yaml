name: roguelike_card_game
description: "A new Flutter project."
publish_to: 'none'
version: 0.4.9+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.17.0
  flame_audio: ^2.10.0
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/images/
    - assets/audio/sfx/
    - assets/audio/music/
