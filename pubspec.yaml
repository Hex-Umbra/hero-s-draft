name: roguelike_card_game
description: "A new Flutter project."
publish_to: 'none'
version: 0.5.1+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.17.0
  flame_audio: ^2.10.0
  flutter_riverpod: ^2.5.1
  uuid: ^4.4.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/data/
    - assets/data/cards/
    - assets/data/classes/berserker/
    - assets/data/classes/berserker/cards/
    - assets/data/classes/mage/
    - assets/data/classes/mage/cards/
    - assets/data/classes/paladin/
    - assets/data/classes/paladin/cards/
    - assets/data/enemies/gobelin/
    - assets/data/enemies/orc/
    - assets/data/enemies/slime/
    - assets/data/enemies/squelette/
    - assets/data/events/
    - assets/data/forge_upgrades/
    - assets/data/passives/
    - assets/data/relics/
    - assets/images/
